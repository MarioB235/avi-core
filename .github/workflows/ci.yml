name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: avicore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, intl
          coverage: none

      - name: Composer validate y audit
        run: |
          composer validate --strict
          composer audit --locked

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JS y build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Anti-drift agente
        run: pnpm run check:agent-docs

      # phpunit.xml fija DB_DATABASE=avicore_test (overridea env del job)
      - name: Crear base de tests
        env:
          PGPASSWORD: secret
        run: psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE avicore_test;"

      - name: Tests
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: avicore_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
        run: php artisan test --compact
